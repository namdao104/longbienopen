<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3b5bdb" />
<title>MIHU ART — Lịch dạy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Bảng màu lấy đúng từ giao diện CŨ của CRM (xanh dương) — giáo viên nhìn ra ngay đây là
     cùng một sản phẩm với bản quản trị mà mọi người đang dùng hằng ngày. */
  :root{
    --bg:#f2f3f7; --surface:#ffffff; --border:#e6e8ee;
    --text:#151823; --text-muted:#6b7280; --text-faint:#8a8f9c;
    --accent:#3b5bdb; --accent-soft:#eef1fd;
    --green:#1a9c6b; --green-soft:#e8f7f1;
    --amber:#a5680a; --amber-soft:#fdf3e4;
    --red:#d13c3c; --red-soft:#fceaea;
    --violet:#7c5cd6; --violet-soft:#f1edfb;
    --rail:#3b5bdb;
    --radius:12px;
    --shadow:0 1px 2px rgba(20,22,35,.04),0 1px 8px rgba(20,22,35,.03);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(24px + var(--safe-b));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}

  /* ---------- Đầu trang ---------- */
  header{
    background:var(--surface); color:var(--text);
    border-bottom:1px solid var(--border);
    padding:calc(13px + env(safe-area-inset-top,0px)) 0 13px;
    position:sticky; top:0; z-index:20;
  }
  .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .hd-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .hd-logo{width:34px;height:34px;border-radius:9px;object-fit:contain;flex:none;
    background:var(--surface);border:1px solid var(--border);padding:2px;}
  .hd-name{font-size:18px;font-weight:700;letter-spacing:-.01em;}
  .hd-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .hd-out{font-size:11.5px;font-weight:600;background:var(--surface);color:var(--red);
    border:1.5px solid var(--border);padding:7px 11px;border-radius:8px;cursor:pointer;}

  /* ---------- Chuyển ngày ---------- */
  .days{display:flex;gap:8px;margin:14px 0 4px;}
  .day{
    flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
    padding:9px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--text-muted);
  }
  .day .d-lb{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .day .d-dt{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;margin-top:2px;}
  .day[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .day:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;}

  /* ---------- Nút mở thời khoá biểu cả tuần ---------- */
  .tkb-btn{width:100%;margin:8px 0 0;padding:11px;border-radius:11px;background:var(--surface);
    border:1.5px solid var(--border);color:var(--accent);font:inherit;font-weight:700;
    font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
  .tkb-btn:active{transform:scale(.99);}

  /* ---------- Trang thời khoá biểu cả tuần ---------- */
  .wk-day{margin-top:16px;}
  .wk-day-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--accent);margin-bottom:7px;}
  .wk-day-hd .n{font-size:11px;font-weight:600;color:var(--text-faint);text-transform:none;letter-spacing:0;}
  .wk-day.today .wk-day-hd{color:var(--green);}
  .wk-slot{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
    padding:10px 12px;margin-bottom:8px;display:flex;gap:11px;box-shadow:var(--shadow);}
  .wk-slot.today{border-color:var(--green);}
  .wk-time{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;
    color:var(--text);flex:none;width:47px;line-height:1.35;}
  .wk-time .e{color:var(--text-faint);font-size:11.5px;}
  .wk-info{min-width:0;flex:1;}
  .wk-mon{font-size:14.5px;font-weight:700;letter-spacing:-.01em;}
  .wk-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .wk-tg{font-size:11.5px;color:var(--accent);margin-top:2px;font-weight:600;}
  .wk-sum{font-size:12px;color:var(--text-muted);margin-top:12px;
    background:var(--accent-soft);border-radius:10px;padding:9px 11px;line-height:1.5;}

  .daynote{font-size:12px;color:var(--text-faint);margin:8px 2px 14px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .daynote .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .daynote .warn{background:var(--red-soft);color:var(--red);font-weight:700;font-size:11.5px;
    padding:4px 10px;border-radius:20px;display:none;}
  .daynote .warn-note{display:none;background:none;border:0;padding:0;font:inherit;
    font-size:11px;font-weight:600;color:var(--red);cursor:pointer;text-align:right;
    text-decoration:underline;text-underline-offset:2px;}

  /* ---------- Đường thời gian: chữ ký của màn hình này ----------
     Giáo viên nghĩ theo mốc giờ trong ngày, nên giờ là trục chính chứ không phải tên lớp. */
  .rail{position:relative;padding-left:62px;}
  .rail::before{
    content:"";position:absolute;left:47px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(180deg,transparent,var(--border) 8%,var(--border) 92%,transparent);
  }
  .ca{position:relative;margin-bottom:14px;}
  .ca-time{
    position:absolute;left:-62px;top:14px;width:44px;text-align:right;
    font-family:"IBM Plex Mono",monospace;font-weight:600;
  }
  .ca-h{font-size:14px;color:var(--text);letter-spacing:-.02em;}
  .ca-e{font-size:11px;color:var(--text-faint);}
  .ca-dot{
    position:absolute;left:-19px;top:19px;width:11px;height:11px;border-radius:50%;
    background:var(--surface);border:2.5px solid var(--rail);
  }
  .ca.done .ca-dot{background:var(--rail);}

  .card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;}
  .card.sub{border-left:5px solid var(--chip,var(--rail));}
  .card-top{width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;
    padding:13px 14px;cursor:pointer;display:block;}
  .card-top:focus-visible{outline:2.5px solid var(--accent);outline-offset:-3px;}
  .c-mon{font-family:"Be Vietnam Pro",sans-serif;font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .c-meta{font-size:12.5px;color:var(--text-muted);margin-top:3px;}
  .c-tg{font-size:12px;color:var(--accent);margin-top:2px;font-weight:600;}
  .c-tg .off{text-decoration:line-through;color:var(--text-faint);font-weight:500;}
  .c-tg-note{font-size:12px;color:var(--red);margin-top:2px;font-weight:700;}
  .c-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;}

  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.01em;}
  .t-green{background:var(--green-soft);color:var(--green);}
  .t-amber{background:var(--amber-soft);color:var(--amber);}
  .t-red{background:var(--red-soft);color:var(--red);}
  .t-violet{background:var(--violet-soft);color:var(--violet);}
  .t-grey{background:var(--accent-soft);color:var(--text-muted);}

  .count{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;color:var(--text-muted);}
  .count b{color:var(--text);font-size:15px;}
  .chev{float:right;color:var(--text-faint);font-size:12px;margin-top:2px;
    display:inline-block;transition:transform .25s ease;}
  .chev-open{transform:rotate(180deg);}

  /* Cảnh báo có người dạy thay — phải đập vào mắt, giáo viên dễ đến nhầm buổi */
  .swap{background:var(--red-soft);color:var(--red);font-size:12px;font-weight:650;
    padding:8px 14px;border-top:1.5px solid var(--border);}

  /* ---------- Danh sách học viên ---------- */
  .body{border-top:1.5px solid var(--border);padding:4px 0 0;}
  /* Khối panel học viên: đóng theo mặc định (max-height:0), giãn mượt bằng JS đo đúng
     chiều cao thật khi mở — .open chỉ áp dụng cho lần render đầy đủ đầu tiên (server-side-ish),
     tương tác mở/đóng sau đó điều khiển trực tiếp qua inline style để có animation. */
  .card-body-wrap{max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.4,0,.2,1);}
  .card-body-wrap.open{max-height:none;}
  .hv{padding:11px 14px;border-bottom:1px solid var(--accent-soft);}
  .hv:last-child{border-bottom:0;}
  .hv-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .hv-name{font-weight:650;font-size:14.5px;}
  .hv-code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-faint);}
  .hv-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center;}
  .hv-more{background:none;border:0;font:inherit;font-size:11.5px;font-weight:650;
    color:var(--accent);cursor:pointer;padding:3px 0;text-decoration:underline;}
  .hv-detail{margin-top:8px;background:var(--accent-soft);border-radius:10px;padding:10px 11px;font-size:12.5px;}
  .hv-detail h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
  .hv-detail p{margin:0 0 8px;}
  .hv-detail p:last-child{margin-bottom:0;}

  /* ---------- Nút xác nhận ---------- */
  .confirm{padding:12px 14px;border-top:1.5px solid var(--border);background:var(--accent-soft);}
  .btn{width:100%;padding:12px;border-radius:11px;border:0;font:inherit;font-weight:700;
    font-size:14.5px;cursor:pointer;}
  .btn-ok{background:var(--green);color:#fff;}
  .btn-ok:active{transform:scale(.985);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;}
  .confirmed{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--green);}
  .cf-note{font-size:11.5px;color:var(--text-muted);margin-top:7px;line-height:1.45;}

  /* Báo sĩ số chưa đúng — dùng màu đỏ đồng bộ với dashboard OM */
  .btn-warn{background:var(--surface);color:var(--red);border:1.5px solid var(--red);
    margin-top:8px;font-size:13.5px;padding:11px;}
  .btn-warn:active{transform:scale(.985);}
  .btn-send{background:var(--red);color:#fff;margin-top:8px;font-size:13.5px;padding:11px;}
  .rp-form{margin-top:10px;}
  .rp-form textarea{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;
    font:inherit;font-size:16px;background:var(--surface);color:var(--text);
    resize:vertical;min-height:64px;}
  .rp-form textarea:focus{outline:2.5px solid var(--red);outline-offset:-1px;border-color:transparent;}
  .reported{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:650;color:var(--red);}
  .resolved{background:var(--green-soft);color:var(--green);border-radius:9px;padding:8px 10px;
    font-size:12px;font-weight:650;margin-bottom:9px;line-height:1.45;}

  /* ---------- Đăng nhập / trạng thái ---------- */
  .login{max-width:340px;margin:12vh auto;padding:22px;background:var(--surface);
    border:1.5px solid var(--border);border-radius:16px;box-shadow:var(--shadow);}
  /* Logo nam goc phai, cao dung bang khoi chu (ten trung tam + dong mo ta) */
  /* Logo ben trai, cao 46px = dung chieu cao khoi chu (h1 22px/1.15 = 25.3 + 2px + sub 18.75).
     Khong dung align-self:stretch vi anh goc 224x196 se tu keo cao hang len va lam vo bo cuc. */
  .login-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .login-logo{height:46px;width:auto;flex:none;object-fit:contain;border-radius:10px;}
  .login h1{font-family:"Be Vietnam Pro",sans-serif;font-size:22px;margin:0;line-height:1.15;}
  .login p.sub{margin:2px 0 0;font-size:12.5px;color:var(--text-muted);}
  label{display:block;font-size:12px;font-weight:650;margin:0 0 5px;color:var(--text-muted);}
  input{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;
    font:inherit;font-size:16px;margin-bottom:13px;background:var(--surface);color:var(--text);}
  input:focus{outline:2.5px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  .btn-main{background:var(--accent);color:#fff;}
  .err{background:var(--red-soft);color:var(--red);padding:9px 11px;border-radius:9px;
    font-size:12.5px;font-weight:600;margin-bottom:12px;}
  .empty{text-align:center;color:var(--text-faint);font-size:13.5px;padding:44px 20px;line-height:1.6;}
  .skel{height:78px;background:var(--surface);border:1.5px solid var(--border);
    border-radius:var(--radius);margin-bottom:14px;opacity:.6;}

  #toast{position:fixed;left:14px;right:14px;bottom:calc(16px + var(--safe-b));z-index:60;
    background:#3d342e;color:#fff;padding:12px 14px;border-radius:11px;font-size:13px;
    font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.24);display:none;text-align:center;}

  /* ---------- Ghi buổi học (GV tự điền tiến trình) ---------- */
  .newlog{margin-top:11px;border-top:1.5px dashed var(--border);padding-top:11px;}
  .newlog-title{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;
    letter-spacing:.03em;margin-bottom:8px;}
  .meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
  .meta-chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:3px 8px;color:var(--text-muted);}
  .newlog label{font-size:11.5px;}
  .newlog textarea{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;
    font:inherit;font-size:16px;margin-bottom:3px;background:var(--surface);color:var(--text);
    resize:vertical;min-height:52px;}
  .newlog textarea:focus{outline:2.5px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  .newlog input[type=number],.newlog input[type=url]{width:100%;padding:9px 10px;
    border:1.5px solid var(--border);border-radius:9px;font:inherit;font-size:16px;
    margin-bottom:9px;background:var(--surface);color:var(--text);}
  .mic-hint{font-size:10.5px;color:var(--accent);margin:0 0 9px;display:flex;align-items:center;gap:5px;font-weight:600;}
  .mic-hint .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);flex:none;}
  .newlog .btn{margin-top:2px;}

  .milestone-box{background:var(--violet-soft);border:1.5px dashed var(--violet);border-radius:10px;
    padding:9px 10px;margin-bottom:11px;font-size:11.5px;color:#5a4396;}
  .milestone-box b{color:var(--violet);}
  .scorerow{display:flex;gap:7px;margin-bottom:2px;}
  .scorerow > div{flex:1;}
  .scorerow input{text-align:center;}
  .scorerow-lbl{display:flex;gap:7px;margin-bottom:4px;}
  .scorerow-lbl span{flex:1;text-align:center;font-size:10px;color:var(--text-faint);font-weight:650;}
  .attend-summary{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:2px 0 11px;}
  .checkline input{width:auto;margin:0;}
  /* ---------- Ảnh bài vẽ ---------- */
  .ph-wrap{margin:2px 0 11px;}
  .ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
  .ph-item{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;
    border:1.5px solid var(--border);background:var(--bg);}
  .ph-item img{width:100%;height:100%;object-fit:contain;display:block;}
  .ph-del{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
    border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;}
  .ph-add{width:100%;padding:10px;border-radius:9px;border:1.5px dashed var(--accent);
    background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:650;
    font-size:12.5px;cursor:pointer;}
  .ph-add:disabled{opacity:.55;cursor:not-allowed;}
  .ph-note{font-size:10.5px;color:var(--text-faint);margin-top:5px;line-height:1.45;}
  .ph-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .ph-row img{width:64px;height:64px;object-fit:contain;border-radius:8px;
    border:1.5px solid var(--border);display:block;background:var(--bg);}

  .log-saved{font-size:11.5px;color:var(--green);font-weight:650;margin-top:8px;
    display:flex;align-items:center;gap:6px;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   MIHU ART — Cổng giáo viên (chỉ xem)
   Giáo viên KHÔNG điểm danh. Giáo vụ điểm danh; hết ca giáo viên xem lại
   số bạn đi học thực tế và bấm "OK" để xác nhận với giáo vụ.
   Toàn bộ dữ liệu lấy qua 5 hàm RPC có kiểm tra danh tính ở server, nên
   file này không tự lọc quyền — có sửa gì trên máy cũng không xem được
   ca của giáo viên khác.
   ===================================================================== */
const SUPABASE_URL = "https://vuljmhejucabakqzpllj.supabase.co";

/* ---------------- Nền tảng ---------------- */
function saveSession(d){
  session = { access_token:d.access_token, refresh_token:d.refresh_token,
              expires_at: Math.floor(Date.now()/1000) + (d.expires_in||3600), user:d.user };
  localStorage.setItem("mihu_gv_session", JSON.stringify(session));
}
function clearSession(){ session = null; me = null; localStorage.removeItem("mihu_gv_session"); }

async function refreshIfNeeded(){
  if (!session) return false;
  if (session.expires_at - 90 > Math.floor(Date.now()/1000)) return true;
  try {
    const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST", headers:{ apikey:ANON_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) { clearSession(); return false; }
    saveSession(d); return true;
  } catch(e){ return false; }
}

async function api(path, opts){
  opts = opts || {};
  await refreshIfNeeded();
  const r = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: { apikey:ANON_KEY, "Content-Type":"application/json",
               Authorization: "Bearer " + (session ? session.access_token : ANON_KEY),
               ...(opts.headers||{}) }
  });
  if (!r.ok) {
    const t = await r.text();
    // 401 = phiên hết hạn thật sự -> đưa về đăng nhập thay vì hiện lỗi kỹ thuật khó hiểu
    if (r.status === 401) { clearSession(); render(); throw new Error("Phiên đăng nhập đã hết hạn."); }
    throw new Error(t || r.statusText);
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const rpc = (name, args) => api("/rest/v1/rpc/" + name,
  { method:"POST", body: JSON.stringify(args || {}) });

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 4200);
}
const esc = s => String(s == null ? "" : s)

function dateOf(offset){
  const d = new Date(); d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function labelOf(offset){
  const d = new Date(); d.setDate(d.getDate() + offset);
  const thu = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"][d.getDay()];
  return { thu, dm: `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}` };
}

/* ---------------- Màn hình đăng nhập ---------------- */
function renderLogin(errMsg){
  document.getElementById("app").innerHTML = `
    <div class="login">
      <div class="login-head">
        <img class="login-logo" src="${MIHU_LOGO_DATA_URI}" alt="MIHU ART" />
        <div>
          <h1>MIHU ART</h1>
          <p class="sub">Lịch dạy của giáo viên</p>
        </div>
      </div>
      ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ""}
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" inputmode="email" />
      <label for="pw">Mật khẩu</label>
      <input id="pw" type="password" autocomplete="current-password" />
      <button class="btn btn-main" id="go">Đăng nhập</button>
    </div>`;
  const go = async () => {
    const btn = document.getElementById("go");
    const email = document.getElementById("em").value.trim();
    const pw = document.getElementById("pw").value;
    if (!email || !pw) return renderLogin("Nhập email và mật khẩu.");
    btn.disabled = true; btn.textContent = "Đang đăng nhập...";
    try {
      const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
        method:"POST", headers:{ apikey:ANON_KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ email, password: pw })
      });
      const d = await r.json();
      if (!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || "Sai email hoặc mật khẩu.");
      saveSession(d); render();
    } catch (e) { renderLogin(e.message); }
  };
  document.getElementById("go").onclick = go;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") go(); };
}

/* ---------------- Khung chính ---------------- */

    try {

      const p = rows && rows[0];
      if (!p) { clearSession(); return renderLogin("Không tìm thấy hồ sơ tài khoản."); }

/* ---------------- Danh sách ca trong ngày ---------------- */
/* Bộ đếm ca chưa xác nhận là con số TỔNG của hôm qua + hôm nay, không phụ thuộc đang xem
   ngày nào — giáo viên mở app (mặc định vào hôm nay) là thấy ngay còn nợ bao nhiêu ca. */
let warnCounts = { qua: 0, nay: 0 };

function paintWarn(){
  const pill = document.getElementById("daywarn");
  const note = document.getElementById("daywarn-note");
  if (!pill) return;
  const tong = warnCounts.qua + warnCounts.nay;
  pill.textContent = tong ? `${tong} ca chưa xác nhận` : "";
  pill.style.display = tong ? "inline-block" : "none";
  if (!note) return;
  note.textContent = warnCounts.qua ? `Có ${warnCounts.qua} ca từ hôm qua chưa xác nhận →` : "";
  note.style.display = warnCounts.qua ? "block" : "none";
  note.onclick = () => { dayOffset = -1; openSlot = null; render(); };
}

async function refreshWarn(){
  try {
    const ngayQua = dateOf(-1), ngayNay = dateOf(0);
    const [qua, nay] = await Promise.all([
      rpc("teacher_schedule", { p_date: ngayQua }),
      rpc("teacher_schedule", { p_date: ngayNay })
    ]);
    const now = new Date();
    warnCounts.qua = (qua || []).filter(c => chuaXacNhan(c, true)).length;
    warnCounts.nay = (nay || []).filter(c => chuaXacNhan(c, now > new Date(`${ngayNay}T${c.end_time}`))).length;
  } catch (e) { warnCounts = { qua: 0, nay: 0 }; }
  paintWarn();
}
// Trợ giảng của ca — gạch ngang tên người nghỉ hôm đó và nói rõ hệ quả, để giáo viên biết trước
// khi lên lớp là còn ai hỗ trợ hay phải tự xoay. tro_giang / tro_giang_nghi do RPC trả về, cùng
// dạng chuỗi nối bằng " · ".
function dongTroGiang(c, ngay){
  const tenTG = (c.tro_giang || "").split(" · ").map(x => x.trim()).filter(Boolean);
  if (!tenTG.length) return "";
  const tenNghi = (c.tro_giang_nghi || "").split(" · ").map(x => x.trim()).filter(Boolean);
  const dsHtml = tenTG
    .map(t => tenNghi.includes(t) ? `<span class="off">${esc(t)}</span>` : esc(t))
    .join(" · ");
  const ddmm = (ngay || "").slice(5).split("-").reverse().join("/");
  const chuThich = tenNghi.length
    ? `<div class="c-tg-note">Nghỉ dạy: ${esc(tenNghi.join(" · "))} · ${ddmm}</div>` : "";
  return `<div class="c-tg">Trợ giảng: ${dsHtml}</div>${chuThich}`;
}

async function loadDay(){
  const box = document.getElementById("list");
  const ngay = dateOf(dayOffset);
  paintWarn();
  refreshWarn();
  let cas;
  try { cas = await rpc("teacher_schedule", { p_date: ngay }); }
  catch (e) { box.innerHTML = `<div class="empty">Không tải được lịch dạy.<br>${esc(e.message)}</div>`; return; }

  if (!cas || !cas.length) {
    const emptyMsg = dayOffset===-1 ? "Hôm qua bạn không có ca dạy nào."
      : dayOffset===0 ? "Hôm nay bạn không có ca dạy nào." : "Ngày mai bạn không có ca dạy nào.";
    box.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  const now = new Date();
  box.innerHTML = `<div class="rail">` + cas.map(c => {
    const ketThuc = new Date(`${ngay}T${c.end_time}`);
    const daXong = dayOffset < 0 || (dayOffset === 0 && now > ketThuc);
    const mo = openSlot === c.slot_id;
    const mau = MON_COLOR[c.subject_name] || "#6b705c";

    let vaiTro = "";
    if (c.vai_tro === "day_thay")   vaiTro = `<span class="tag t-violet">Dạy thay</span>`;
    if (c.vai_tro === "tang_cuong") vaiTro = `<span class="tag t-amber">Tăng cường</span>`;

    return `
    <div class="ca ${daXong ? "done" : ""}">
      <div class="ca-time"><div class="ca-h">${hhmm(c.start_time)}</div><div class="ca-e">${hhmm(c.end_time)}</div></div>
      <div class="ca-dot"></div>
      <div class="card sub" style="--chip:${mau}">
        <button class="card-top" data-slot="${c.slot_id}" aria-expanded="${mo}">
          <span class="chev ${mo ? "chev-open" : ""}">▼</span>
          <div class="c-mon">${esc(c.subject_name || "—")}</div>
          <div class="c-meta">${esc(c.class_name)} · ${esc(c.location_code)} · ${esc(c.room_name || "chưa xếp phòng")}</div>
          ${dongTroGiang(c, ngay)}
          <div class="c-row">
            ${vaiTro}
            <span class="count"><b>${c.si_so}</b> học viên</span>
            ${c.da_diem_danh
              ? `<span class="tag t-green">Đã điểm danh · ${c.so_di_hoc}/${c.si_so} đi học</span>`
              : `<span class="tag t-grey">Giáo vụ chưa điểm danh</span>`}
            ${c.da_xac_nhan ? `<span class="tag t-green">✓ Bạn đã xác nhận</span>` : ""}
            ${chuaXacNhan(c, daXong) ? `<span class="tag t-red">Bạn chưa xác nhận</span>` : ""}
            ${c.kind === "yeu_cau_kiem_tra" ? `<span class="tag t-red">⏳ Chờ giáo vụ kiểm tra</span>` : ""}
          </div>
        </button>
        ${c.co_nguoi_day_thay
          ? `<div class="swap">⚠️ Ca này đã có <b>${esc(c.nguoi_day_thay)}</b> dạy thay — bạn không cần đến.</div>` : ""}
        <div class="card-body-wrap ${mo ? "open" : ""}" id="wrap-${c.slot_id}">
          <div class="body" id="hv-${c.slot_id}"><div class="empty" style="padding:20px;">Đang tải học viên…</div></div>
          ${confirmBlock(c, daXong)}
        </div>
      </div>
    </div>`;
  }).join("") + `</div>`;

  box.querySelectorAll(".card-top").forEach(b => b.onclick = () => toggleSlot(b, box, ngay));
  box.querySelectorAll("[data-confirm]").forEach(b => b.onclick = () => confirmSlot(b.dataset.confirm, b));
  box.querySelectorAll("[data-report]").forEach(b => b.onclick = () => toggleReport(b));
  box.querySelectorAll("[data-sendreport]").forEach(b => b.onclick = () => sendReport(b.dataset.sendreport, b));
  if (openSlot) loadStudents(openSlot, ngay);
}

/* Khối nút xác nhận — chỉ xuất hiện khi thật sự dùng được, kèm lý do nếu chưa dùng được.
   3 trạng thái từ teacher_session_confirmations.kind:
     xac_nhan         → GV đã xác nhận số đúng
     yeu_cau_kiem_tra → GV đã báo sĩ số chưa đúng, đang chờ giáo vụ
     da_xu_ly         → giáo vụ đã sửa xong, mời GV xác nhận lại số mới */
function confirmBlock(c, daXong){
  if (c.kind === "yeu_cau_kiem_tra") {
    return `<div class="confirm">
      <div class="reported">⏳ Đã báo sĩ số chưa đúng — đang chờ giáo vụ kiểm tra</div>
      ${c.ghi_chu ? `<div class="cf-note">Nội dung bạn đã báo: “${esc(c.ghi_chu)}”</div>` : ""}</div>`;
  }
  if (c.da_xac_nhan) {
    return `<div class="confirm"><div class="confirmed">✓ Đã xác nhận ${c.so_luc_xac_nhan}/${c.si_so} bạn đi học</div>
      <div class="cf-note">Nếu con số này không đúng, báo lại giáo vụ để sửa điểm danh.</div></div>`;
  }
  if (!daXong) {
    return `<div class="confirm"><div class="cf-note">Xác nhận được sau khi ca kết thúc lúc ${hhmm(c.end_time)}.</div></div>`;
  }
  if (!c.da_diem_danh) {
    return `<div class="confirm"><div class="cf-note">Giáo vụ chưa điểm danh ca này. Khi có số liệu, bạn sẽ xác nhận được ở đây.</div></div>`;
  }
  return `<div class="confirm">
    ${c.da_xu_ly ? `<div class="resolved">✓ Giáo vụ đã xử lý phản ánh của bạn — xem lại số mới rồi xác nhận giúp.</div>` : ""}
    <button class="btn btn-ok" data-confirm="${c.slot_id}">OK — xác nhận ${c.so_di_hoc}/${c.si_so} bạn đi học</button>
    <button class="btn btn-warn" data-report="${c.slot_id}">Báo sĩ số chưa đúng</button>
    <div class="rp-form" id="rp-${c.slot_id}" hidden>
      <textarea id="rpnote-${c.slot_id}" rows="3"
        placeholder="Ghi rõ chỗ chưa đúng, VD: bạn Minh có đi học nhưng đang bị báo vắng."></textarea>
      <button class="btn btn-send" data-sendreport="${c.slot_id}">Gửi phản ánh tới giáo vụ</button>
    </div>
    <div class="cf-note">Số đúng thì bấm OK. Nếu lệch, bấm “Báo sĩ số chưa đúng” để giáo vụ kiểm tra lại.</div></div>`;
}

/* Mở ô ghi lý do — nhớ nới chiều cao panel đang mở để không bị cắt mất ô nhập */
function toggleReport(btn){
  const form = document.getElementById("rp-" + btn.dataset.report);
  if (!form) return;
  form.hidden = !form.hidden;
  btn.textContent = form.hidden ? "Báo sĩ số chưa đúng" : "Thôi, không báo nữa";
  const wrap = document.getElementById("wrap-" + btn.dataset.report);
  requestAnimationFrame(() => {
    growWrapToFit(wrap);
    if (!form.hidden) form.querySelector("textarea").focus();
  });
}

async function sendReport(slotId, btn){
  const ta = document.getElementById("rpnote-" + slotId);
  const note = (ta && ta.value || "").trim();
  if (note.length < 5) { toast("Ghi rõ giúp chỗ nào chưa đúng để giáo vụ biết đường sửa."); if (ta) ta.focus(); return; }
  btn.disabled = true; btn.textContent = "Đang gửi…";
  try {
    const r = await rpc("teacher_report_session", { p_slot_id: slotId, p_date: dateOf(dayOffset), p_note: note });
    const res = Array.isArray(r) ? r[0] : r;
    if (res && res.ok === false) { toast(res.message || "Chưa gửi được."); btn.disabled = false; btn.textContent = "Gửi phản ánh tới giáo vụ"; return; }
    toast(res && res.message ? res.message : "Đã gửi phản ánh tới giáo vụ.");
    loadDay();
  } catch (e) { toast("Không gửi được: " + e.message); btn.disabled = false; btn.textContent = "Gửi phản ánh tới giáo vụ"; }
}

async function confirmSlot(slotId, btn){
  btn.disabled = true; btn.textContent = "Đang gửi…";
  try {
    const r = await rpc("teacher_confirm_session", { p_slot_id: slotId, p_date: dateOf(dayOffset) });
    const res = Array.isArray(r) ? r[0] : r;
    toast(res && res.message ? res.message : "Đã xác nhận.");
    loadDay();
  } catch (e) { toast("Không xác nhận được: " + e.message); btn.disabled = false; }
}

/* Mở/đóng panel học viên có animation — đo đúng chiều cao thật (scrollHeight) thay vì
   dùng 1 số cố định lớn, để tốc độ trượt luôn đều bất kể nội dung dài ngắn khác nhau. */
function expandWrap(el){
  el.style.maxHeight = el.scrollHeight + "px";
}
function collapseWrap(el){
  el.style.maxHeight = el.scrollHeight + "px"; // chốt chiều cao hiện tại làm điểm bắt đầu
  requestAnimationFrame(() => { el.style.maxHeight = "0px"; });
}
function growWrapToFit(el){
  if (el && el.style.maxHeight !== "0px") el.style.maxHeight = el.scrollHeight + "px";
}

function toggleSlot(btn, box, ngay){
  const slotId = btn.dataset.slot;
  const wrap = document.getElementById("wrap-" + slotId);
  const chev = btn.querySelector(".chev");

  if (openSlot === slotId) {
    openSlot = null;
    collapseWrap(wrap);
    chev.classList.remove("chev-open");
    btn.setAttribute("aria-expanded", "false");
    return;
  }

  if (openSlot) {
    const prevWrap = document.getElementById("wrap-" + openSlot);
    const prevBtn = box.querySelector(`.card-top[data-slot="${openSlot}"]`);
    if (prevWrap) collapseWrap(prevWrap);
    if (prevBtn) { prevBtn.querySelector(".chev").classList.remove("chev-open"); prevBtn.setAttribute("aria-expanded", "false"); }
  }

  openSlot = slotId;
  chev.classList.add("chev-open");
  btn.setAttribute("aria-expanded", "true");
  expandWrap(wrap); // mở ngay với placeholder "Đang tải…", sẽ tự lớn thêm khi có dữ liệu thật
  loadStudents(slotId, ngay);
}

/* ---------------- Học viên trong ca ---------------- */
async function loadStudents(slotId, ngay){
  const box = document.getElementById("hv-" + slotId);
  if (!box) return;
  const key = slotId + "|" + ngay;
  // Cache CHỈ để vẽ ngay cho đỡ giật, KHÔNG được dùng thay cho dữ liệu mới: giáo viên thường
  // mở ca trước khi giáo vụ điểm danh, nếu giữ nguyên bản cache thì cả buổi sẽ không thấy
  // trạng thái điểm danh dù giáo vụ đã nhập xong.
  const daCo = cacheStudents[key];
  try {
    const moi = await rpc("teacher_slot_students", { p_slot_id: slotId, p_date: ngay });
    cacheStudents[key] = moi || [];
  } catch (e) {
    if (!daCo) {
      box.innerHTML = `<div class="empty" style="padding:20px;">${esc(e.message)}</div>`;
      growWrapToFit(document.getElementById("wrap-" + slotId));
      return;
    }
    // Lỗi mạng mà đã có bản cũ thì vẫn hiện bản cũ, hơn là để trống
  }

  const hs = cacheStudents[key] || [];
  if (!hs.length) {
    box.innerHTML = `<div class="empty" style="padding:20px;">Chưa có học viên nào trong ca này.</div>`;
    growWrapToFit(document.getElementById("wrap-" + slotId));
    return;
  }

  box.innerHTML = hs.map(h => {
    const k = KIEU_CL[h.kieu_trong_ca] || { t:h.kieu_trong_ca, fg:"#5a616e", bg:"#eceef2" };
    const dd = h.diem_danh ? (DIEM_DANH[h.diem_danh] || {t:h.diem_danh,c:"t-grey"}) : null;
    const baoLuu = h.trang_thai_hoc_vien === "bảo_lưu";
    // Học bù / Tăng cường luôn gắn với 1 ngày cụ thể — hiện ngày ngay trên nhãn như bên TKB
    const ngayXep = (h.kieu_trong_ca === "hoc_bu" || h.kieu_trong_ca === "tang_cuong") && h.ngay_xep
      ? " " + ddmm(h.ngay_xep) : "";

/* Piano (và các môn tương tự) cứ hết total_sessions buổi là sang khoá mới, đếm lại từ đầu.
   Không có cột "khoá thứ mấy" riêng trong DB nên tự suy ra từ session_number tuyệt đối. */
function khoaOf(sessionNumber, total){
  if (!sessionNumber || !total) return { khoa: null, buoiTrongKhoa: sessionNumber };
  return {
    khoa: Math.floor((sessionNumber - 1) / total) + 1,
    buoiTrongKhoa: ((sessionNumber - 1) % total) + 1
  };
}

function renderHistoryByKhoa(tt, totalSessions, anh){
  if (!tt || !tt.length) return `<p>Chưa có buổi học nào được ghi nhận.</p>`;
  anh = anh || [];
  // Ảnh khớp buổi theo session_number; ảnh chưa kịp nối (up xong chưa lưu buổi) thì khớp theo ngày.
  const anhCuaBuoi = s => anh.filter(a =>
    (a.session_number != null && s.session_number != null && a.session_number === s.session_number)
    || (a.session_number == null && a.session_date === s.session_date));
  const rowHtml = s => {
    const as = anhCuaBuoi(s);
    return `<div style="margin-bottom:9px;padding-bottom:9px;border-bottom:1px dashed var(--border);">
    <b>${esc(s.session_date || "")}</b>${s.session_number ? ` · Buổi ${s.session_number}` : ""}${s.teacher_name ? ` · <span style="color:var(--accent)">GV ${esc(s.teacher_name)}</span>` : ""}<br>
    <span style="color:var(--violet);font-weight:700">${esc(s.content || "(chưa ghi nội dung)")}</span>${s.assessment ? `<br><i>${esc(s.assessment)}</i>` : ""}
    ${as.length ? `<div class="ph-row">${as.map(a => `<a href="${esc(a.public_url)}" target="_blank" rel="noopener"><img src="${esc(anhNho(a.public_url, 300))}" alt="Ảnh bài vẽ buổi ${s.session_number || ""}" loading="lazy" onerror="anhLoi(this,'${esc(a.public_url)}')" /></a>`).join("")}</div>` : ""}</div>`;
  };

  if (!totalSessions) return tt.map(rowHtml).join(""); // không rõ total_sessions thì hiện phẳng như cũ

  const byKhoa = {};
  tt.forEach(s => {
    const { khoa } = khoaOf(s.session_number, totalSessions);
    const key = khoa ?? "?";
    if (!byKhoa[key]) byKhoa[key] = [];
    byKhoa[key].push(s);
  });
  const khoaKeys = Object.keys(byKhoa).sort((a, b) => (b === "?" ? -1 : Number(b)) - (a === "?" ? -1 : Number(a)));

  return khoaKeys.map(k => {
    const rows = byKhoa[k];
    const maxBuoi = Math.max(...rows.map(s => khoaOf(s.session_number, totalSessions).buoiTrongKhoa || 0));
    const label = k === "?" ? "Chưa rõ khoá" : `Khoá ${k} (${maxBuoi}/${totalSessions} buổi)`;
    return `<div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px;">${esc(label)}</div>`
      + rows.map(rowHtml).join("");
  }).join("");
}

const micHint = () => `<div class="mic-hint"><span class="dot"></span>Bấm mic trên bàn phím để đọc thay vì gõ</div>`;

/* Khối "+ Ghi buổi học hôm nay" — GV tự chọn tab Buổi thường / Buổi mốc, không để hệ thống tự đoán,
   vì total_sessions lưu trong DB có thể không khớp gói học thực tế của bạn học. */
/* ---------------- Ảnh bài vẽ ----------------
   Ảnh chụp thẳng từ điện thoại nặng 3–5MB. Nén ngay trên máy giáo viên trước khi tải lên:
   hạ cạnh dài về 1200px + JPEG 0.65 → ảnh iPhone 3–4MB còn ~200–250KB, vừa nhẹ kho lưu trữ vừa gửi nhanh
   khi các cô dùng 4G ở lớp. Giới hạn 10 ảnh/khoá được chặn cả ở đây lẫn ở database. */
const PHOTO_BUCKET = "student-artwork";
// Môn Mỹ thuật đánh giá bằng sản phẩm nhìn được, không phải clip biểu diễn — nên ở buổi mốc
// thay ô "Link video giáo viên quay" bằng ô tải ảnh, dùng chung cơ chế với buổi thường.
const laMyThuat = () => /mỹ\s*thuật/i.test((viewCtx && viewCtx.subjectName) || "");
const PHOTO_MAX_EDGE = 1200;
const PHOTO_QUALITY = 0.65;
const photoCache = {};   // batchId -> danh sách ảnh của khoá hiện tại

/* Ảnh gốc ~500KB; ô xem trước chỉ 60–110px nên tải ảnh gốc là lãng phí, mở 6 ảnh mất ~3MB.
   Dùng Image Transformation của Supabase (có ở gói Pro): đổi /object/public/ -> /render/image/public/
   rồi thêm width. Bấm vào ảnh vẫn mở file gốc. Nếu endpoint lỗi thì trả về link gốc, ảnh vẫn hiện. */
// Bản resize lỗi (endpoint tắt, ảnh hỏng) thì tự quay về file gốc thay vì hiện ô ảnh vỡ.
function anhLoi(img, urlGoc){
  if (img.dataset.fallback) return;
  img.dataset.fallback = "1"; img.src = urlGoc;
}
function anhNho(url, w){
  if (!url || url.indexOf("/object/public/") === -1) return url;
  // resize=contain: giữ nguyên khung hình, không cắt cạnh — bài vẽ phải thấy trọn vẹn.
  return url.replace("/object/public/", "/render/image/public/") + `?width=${w}&height=${w}&quality=60&resize=contain`;
}

function nenAnh(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width: w, height: h } = img;
      const canhDai = Math.max(w, h);
      if (canhDai > PHOTO_MAX_EDGE) {
        const tyLe = PHOTO_MAX_EDGE / canhDai;
        w = Math.round(w * tyLe); h = Math.round(h * tyLe);
      }
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("Không nén được ảnh")), "image/jpeg", PHOTO_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Không đọc được ảnh")); };
    img.src = url;
  });
}

async function taiAnhLen(studentId, blob){
  const ten = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
  const path = `${studentId}/${ten}.jpg`;
  await refreshIfNeeded();
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTO_BUCKET}/${path}`, {
    method: "POST",
    headers: { apikey: ANON_KEY, Authorization: "Bearer " + session.access_token, "Content-Type": "image/jpeg" },
    body: blob
  });
  if (!r.ok) throw new Error(await r.text() || "Tải ảnh thất bại");
  return { path, url: `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${path}` };
}

/* Ảnh hiện trong ô upload phải đúng BỐI CẢNH đang mở, không phải cả khoá:
   tab Buổi thường -> ảnh của buổi hôm nay; tab Buổi mốc -> ảnh của đúng mốc đang chọn.
   Nếu không lọc, ảnh buổi thường sẽ hiện sẵn ở ô ảnh buổi mốc dù mốc chưa diễn ra. */
function locAnhTheoBoiCanh(ds, moc, ngay){
  return (ds || []).filter(a => moc ? a.milestone === moc : (!a.milestone && a.session_date === ngay));
}

function veAnh(studentId, batchId, moc, ngay){
  const grid = document.getElementById("ph-grid-" + studentId);
  const btn = document.getElementById("ph-add-" + studentId);
  const note = document.getElementById("ph-note-" + studentId);

  const ds = locAnhTheoBoiCanh(tatCa, moc, ngay);
  grid.innerHTML = ds.map(a => `
    <div class="ph-item">
      <img src="${esc(anhNho(a.public_url, 300))}" alt="Ảnh bài vẽ" loading="lazy" onerror="anhLoi(this,'${esc(a.public_url)}')" />
      ${a.la_cua_toi ? `<button class="ph-del" data-del="${a.id}" title="Xoá ảnh">✕</button>` : ""}
    </div>`).join("");
  grid.querySelectorAll("[data-del]").forEach(b => b.onclick = () => xoaAnh(b.dataset.del, studentId, batchId, moc, ngay));
  if (btn) {
    btn.disabled = tatCa.length >= 10;   // trần 10 tính trên cả khoá, không phải riêng ô này
    btn.textContent = tatCa.length >= 10 ? "Đã đủ 10 ảnh của khoá này" : `📷 Thêm ảnh (${tatCa.length}/10)`;
  }
  if (note && tatCa.length) {
    note.textContent = "Ảnh của khoá đang học. Sang khoá mới, ảnh khoá cũ tự xoá sau 30 ngày. Chỉ chụp bài vẽ, không chụp mặt học viên.";
  }
}

async function wirePhotos(studentId, batchId, ngay, moc){
  const btn = document.getElementById("ph-add-" + studentId);
  const inp = document.getElementById("ph-file-" + studentId);
  if (!btn || !inp) return;

  if (!photoCache[batchId]) {
    try { photoCache[batchId] = await rpc("teacher_student_photos", { p_batch_id: batchId }) || []; }
    catch (e) { photoCache[batchId] = []; }
  }
  veAnh(studentId, batchId, moc, ngay);
  growWrapToFit(document.getElementById("wrap-" + (viewCtx ? viewCtx.slotId : "")));

  btn.onclick = () => inp.click();
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    inp.value = "";
    if (!files.length) return;
    const conLai = 10 - (photoCache[batchId] || []).length;
    if (files.length > conLai) {
      toast(`Khoá này chỉ còn chỗ cho ${conLai} ảnh — em chỉ tải ${conLai} ảnh đầu.`);
      files.length = Math.max(0, conLai);
    }
    btn.disabled = true;
    for (let i = 0; i < files.length; i++) {
      btn.textContent = `Đang tải ảnh ${i + 1}/${files.length}…`;
      try {
        const blob = await nenAnh(files[i]);
        const up = await taiAnhLen(studentId, blob);
        const r = await rpc("teacher_add_photo", {
          p_student_id: studentId, p_batch_id: batchId,
          p_path: up.path, p_url: up.url, p_date: ngay, p_milestone: moc || null
        });
        const res = Array.isArray(r) ? r[0] : r;
        if (res && res.ok === false) { toast(res.message); break; }
      } catch (e) { toast("Không tải được ảnh: " + e.message); break; }
    }
    try { photoCache[batchId] = await rpc("teacher_student_photos", { p_batch_id: batchId }) || []; } catch (e) {}
    veAnh(studentId, batchId, moc, ngay);
    growWrapToFit(document.getElementById("wrap-" + (viewCtx ? viewCtx.slotId : "")));
  };
}

async function xoaAnh(id, studentId, batchId, moc, ngay){
  if (!confirm("Xoá ảnh này?")) return;
  try {
    const r = await rpc("teacher_delete_photo", { p_id: id });
    const res = Array.isArray(r) ? r[0] : r;
    if (res && res.ok === false) return toast(res.message);
    if (res && res.storage_path) {
      // Xoá luôn file, không chỉ xoá dòng — nếu bỏ bước này file vẫn nằm lại và vẫn tính dung lượng.
      await refreshIfNeeded();
      await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTO_BUCKET}/${res.storage_path}`, {
        method: "DELETE",
        headers: { apikey: ANON_KEY, Authorization: "Bearer " + session.access_token }
      }).catch(() => {});
    }
    photoCache[batchId] = await rpc("teacher_student_photos", { p_batch_id: batchId }) || [];
    veAnh(studentId, batchId, moc, ngay);
    toast("Đã xoá ảnh.");
  } catch (e) { toast("Không xoá được: " + e.message); }
}

      <div class="ph-wrap" id="ph-wrap-${studentId}">
        <div class="ph-grid" id="ph-grid-${studentId}"></div>
        <input type="file" accept="image/*" multiple id="ph-file-${studentId}" style="display:none" />
        <button class="ph-add" id="ph-add-${studentId}">📷 Thêm ảnh</button>
        <div class="ph-note" id="ph-note-${studentId}">Tối đa 10 ảnh mỗi khoá. Ảnh tự nén trước khi tải lên nên gửi nhanh cả khi dùng 4G. Chỉ chụp bài vẽ, không chụp mặt học viên.</div>
      </div>`;
}

function renderLogBlock(studentId, slotId, ngay, batchId, totalSessions){
  if (!logTabState[studentId]) logTabState[studentId] = "thuong";
  const tab = logTabState[studentId];
  const mid = totalSessions ? Math.round(totalSessions / 2) : null;
  const mocLabel = "Buổi mốc"; // bỏ nhãn (X/Y) tự tính — total_sessions trong DB không đáng tin, để GV tự xác định
  const dateChip = esc(ngay.split("-").reverse().join("/"));
  const milestoneType = logTabState["mstype-" + studentId] || "giữa_khóa";
  const existingEv = (existingEvals[studentId] || []).find(e => e.milestone === milestoneType) || null;

  return `
    <div class="newlog">
      <div class="newlog-title">+ Ghi buổi học hôm nay</div>
      <div class="switcher" style="display:flex;gap:8px;margin-bottom:12px;">
        <button class="sw-btn ${tab === "thuong" ? "active" : ""}" data-tab="thuong" data-sid="${studentId}"
          style="flex:1;background:${tab === "thuong" ? "var(--accent-soft)" : "var(--surface)"};border:1.5px solid ${tab === "thuong" ? "var(--accent)" : "var(--border)"};
          border-radius:10px;padding:9px 6px;text-align:center;font:inherit;font-size:12.5px;font-weight:650;
          color:${tab === "thuong" ? "var(--accent)" : "var(--text-muted)"};">Buổi thường</button>
        <button class="sw-btn ${tab === "moc" ? "active" : ""}" data-tab="moc" data-sid="${studentId}"
          style="flex:1;background:${tab === "moc" ? "var(--accent-soft)" : "var(--surface)"};border:1.5px solid ${tab === "moc" ? "var(--accent)" : "var(--border)"};
          border-radius:10px;padding:9px 6px;text-align:center;font:inherit;font-size:12.5px;font-weight:650;
          color:${tab === "moc" ? "var(--accent)" : "var(--text-muted)"};">${esc(mocLabel)}</button>
      </div>

      ${tab === "thuong" ? `
      <div class="meta-row">
        <span class="meta-chip">${dateChip}</span>
        <span class="meta-chip">GV: ${esc(me.staff_name)}</span>
      </div>
      <label>Kiến thức mới, bài mới</label>
      <textarea id="log-content-${studentId}" placeholder="VD: học bài Twinkle Twinkle Little Star, tay phải"></textarea>
      ${micHint()}
      <label>Đánh giá / nhận xét</label>
      <textarea id="log-assessment-${studentId}" placeholder="VD: con tiếp thu nhanh, cần luyện thêm tốc độ"></textarea>
      ${micHint()}
      ${photoBlockHtml(studentId, "Ảnh bài vẽ / sản phẩm của con")}

      <button class="btn btn-ok" id="log-save-${studentId}">Lưu buổi học</button>
      <div id="log-status-${studentId}"></div>` : ""}

      ${tab === "moc" ? `
      <div class="meta-row">
        <span class="meta-chip">${dateChip}</span>
        <span class="meta-chip">GV: ${esc(me.staff_name)}</span>
      </div>
      <div class="milestone-box">
        🎯 <b>Buổi mốc</b> — ngoài nội dung buổi học, điền thêm đánh giá tổng quát bên dưới.
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button class="mstype-btn" data-sid="${studentId}" data-type="giữa_khóa"
            style="flex:1;padding:6px 4px;border-radius:8px;font:inherit;font-size:11px;font-weight:650;cursor:pointer;
            border:1.5px solid var(--violet);background:${milestoneType === "giữa_khóa" ? "var(--violet)" : "var(--surface)"};
            color:${milestoneType === "giữa_khóa" ? "#fff" : "var(--violet)"};">Giữa khoá</button>
          <button class="mstype-btn" data-sid="${studentId}" data-type="cuối_khóa"
            style="flex:1;padding:6px 4px;border-radius:8px;font:inherit;font-size:11px;font-weight:650;cursor:pointer;
            border:1.5px solid var(--violet);background:${milestoneType === "cuối_khóa" ? "var(--violet)" : "var(--surface)"};
            color:${milestoneType === "cuối_khóa" ? "#fff" : "var(--violet)"};">Cuối khoá</button>
        </div>
      </div>
      ${existingEv ? `<div style="font-size:11px;color:var(--green);font-weight:650;margin:-4px 0 10px;">✓ Đã có đánh giá${existingEv.session_marker ? " (" + esc(existingEv.session_marker) + ")" : ""} — form dưới đây điền sẵn, sửa lại nếu cần</div>` : ""}

      <label>Tên bài quay video đánh giá</label>
      <textarea id="ev-song-${studentId}" style="min-height:38px" placeholder="VD: Một con vịt">${existingEv && existingEv.song_title ? esc(existingEv.song_title) : ""}</textarea>

      <label>Điểm đánh giá (thang 10)</label>
      <div class="scorerow-lbl"><span>BTVN</span><span>Lớp</span><span>Thái độ</span></div>
      <div class="scorerow">
        <div><input type="number" min="0" max="10" id="ev-homework-${studentId}" value="${existingEv && existingEv.score_homework != null ? existingEv.score_homework : ""}"></div>
        <div><input type="number" min="0" max="10" id="ev-class-${studentId}" value="${existingEv && existingEv.score_class != null ? existingEv.score_class : ""}"></div>
        <div><input type="number" min="0" max="10" id="ev-attitude-${studentId}" value="${existingEv && existingEv.score_attitude != null ? existingEv.score_attitude : ""}"></div>
      </div>

      <label>Chuyên cần trong khoá (tự tính từ điểm danh)</label>
      <div class="attend-summary" id="attend-${studentId}"><span class="tag t-grey">Đang tải…</span></div>

      <label>Các kỹ năng đã đạt được</label>
      <textarea id="ev-skills-good-${studentId}" placeholder="VD: nắm bắt nốt trên khoá Sol, biết tư thế ngồi/để tay">${existingEv && existingEv.skills_achieved ? esc(existingEv.skills_achieved) : ""}</textarea>
      ${micHint()}
      <label>Các kỹ năng chưa hoàn thiện</label>
      <textarea id="ev-skills-bad-${studentId}" placeholder="VD: cần chỉnh tư thế tay, nhận diện ký hiệu nốt">${existingEv && existingEv.skills_pending ? esc(existingEv.skills_pending) : ""}</textarea>
      ${micHint()}
      <label>Phương hướng phát triển</label>
      <textarea id="ev-direction-${studentId}" placeholder="VD: tiếp tục luyện nốt cơ bản, rèn tư thế tay">${existingEv && existingEv.development_direction ? esc(existingEv.development_direction) : ""}</textarea>
      ${micHint()}

      ${laMyThuat()
        ? photoBlockHtml(studentId, "Ảnh sản phẩm buổi mốc")
        : `<label>Link video giáo viên quay</label>
      <input type="url" id="ev-video-${studentId}" placeholder="https://drive.google.com/..." value="${existingEv && existingEv.video_url_teacher ? esc(existingEv.video_url_teacher) : ""}">`}

      <button class="btn btn-ok" id="ev-save-${studentId}">Lưu đánh giá mốc</button>
      <div id="ev-status-${studentId}"></div>` : ""}
    </div>`;
}

function wireLogBlock(studentId, slotId, ngay, batchId){
  document.querySelectorAll(`.sw-btn[data-sid="${studentId}"]`).forEach(b => b.onclick = () => {
    logTabState[studentId] = b.dataset.tab;
    loadStudentDetail(studentId, slotId, ngay, batchId, viewCtx.totalSessions);
  });
  document.querySelectorAll(`.mstype-btn[data-sid="${studentId}"]`).forEach(b => b.onclick = () => {
    logTabState["mstype-" + studentId] = b.dataset.type;
    loadStudentDetail(studentId, slotId, ngay, batchId, viewCtx.totalSessions);
  });
  const saveBtn = document.getElementById("log-save-" + studentId);
  if (saveBtn) saveBtn.onclick = () => submitSession(studentId, slotId, ngay);
  const evBtn = document.getElementById("ev-save-" + studentId);
  if (evBtn) evBtn.onclick = () => submitMilestone(studentId, slotId, ngay, batchId);
  if (logTabState[studentId] === "moc" && batchId) loadAttendSummary(studentId, batchId);
  const tabDangMo = logTabState[studentId];
  if (batchId && tabDangMo === "thuong") wirePhotos(studentId, batchId, ngay, null);
  if (batchId && tabDangMo === "moc" && laMyThuat())
    wirePhotos(studentId, batchId, ngay, logTabState["mstype-" + studentId] || "giữa_khóa");
}

async function submitSession(studentId, slotId, ngay){
  const btn = document.getElementById("log-save-" + studentId);
  const content = document.getElementById("log-content-" + studentId).value.trim();
  const assessment = document.getElementById("log-assessment-" + studentId).value.trim();
  if (!content && !assessment) { toast("Điền ít nhất 1 ô trước khi lưu."); return; }
  btn.disabled = true; btn.textContent = "Đang lưu…";
  try {
    const r = await rpc("teacher_submit_session", {
      p_slot_id: slotId, p_date: ngay, p_student_id: studentId,
      p_content: content, p_assessment: assessment
    });
    const res = Array.isArray(r) ? r[0] : r;
    if (!res || !res.ok) throw new Error((res && res.message) || "Không lưu được.");
    document.getElementById("log-status-" + studentId).innerHTML =
      `<div class="log-saved">✓ Đã lưu (Buổi ${res.session_number})</div>`;
    // Ảnh được up TRƯỚC khi bấm lưu nên lúc đó chưa biết là buổi thứ mấy — nối lại ở đây.
    if (viewCtx && viewCtx.batchId) {
      try { await rpc("teacher_link_photos", { p_batch_id: viewCtx.batchId, p_date: ngay }); } catch (e) {}
    }
    toast("Đã lưu buổi học.");
    btn.disabled = false; btn.textContent = "Lưu buổi học";
    // Vẽ lại để buổi vừa lưu (kèm ảnh) hiện ngay trong phần Tiến trình học tập
    loadStudentDetail(studentId, slotId, ngay, viewCtx ? viewCtx.batchId : null, viewCtx ? viewCtx.totalSessions : null);
  } catch (e) {
    toast("Không lưu được: " + e.message);
    btn.disabled = false; btn.textContent = "Lưu buổi học";
  }
}

/* Buổi mốc: GV tự chọn Giữa khoá/Cuối khoá, lưu 1 lần — chạy 2 RPC nối tiếp
   (ghi buổi học thường trước để có đúng batch_id + số buổi, rồi ghi đánh giá mốc). */
async function submitMilestone(studentId, slotId, ngay, batchId){
  const btn = document.getElementById("ev-save-" + studentId);
  const g = id => document.getElementById(id + studentId);
  const numOrNull = v => (v === "" || v == null) ? null : Number(v);
  const milestoneType = logTabState["mstype-" + studentId] || "giữa_khóa";
  // Nội dung/nhận xét buổi học đã nhập bên tab Buổi thường rồi, tab này không hỏi lại nữa.
  // Số buổi dùng để lưu: nếu đang SỬA đánh giá đã có thì giữ đúng số buổi cũ, còn nếu là đánh giá
  // mới thì dùng số buổi tiếp theo đã ước tính từ tiến trình (buổi mới nhất đã ghi + 1).
  const existingEv = (existingEvals[studentId] || []).find(e => e.milestone === milestoneType);
  const sessionNumber = existingEv ? existingEv.session_number : nextSessionEstimate[studentId];
  if (!sessionNumber) { toast("Chưa xác định được số buổi — hãy lưu Buổi thường của hôm nay trước."); return; }
  btn.disabled = true; btn.textContent = "Đang lưu…";
  try {
    const r2 = await rpc("teacher_submit_milestone_evaluation", {
      p_batch_id: batchId,
      p_milestone: milestoneType,
      p_session_number: sessionNumber,
      p_song_title: g("ev-song-").value.trim() || null,
      p_score_homework: numOrNull(g("ev-homework-").value),
      p_score_class: numOrNull(g("ev-class-").value),
      p_score_attitude: numOrNull(g("ev-attitude-").value),
      p_skills_achieved: g("ev-skills-good-").value.trim() || null,
      p_skills_pending: g("ev-skills-bad-").value.trim() || null,
      p_development_direction: g("ev-direction-").value.trim() || null,
      p_video_url_teacher: (g("ev-video-") ? g("ev-video-").value.trim() : "") || null
    });
    const res2 = Array.isArray(r2) ? r2[0] : r2;
    if (!res2 || !res2.ok) throw new Error((res2 && res2.message) || "Không lưu được đánh giá mốc.");

    document.getElementById("ev-status-" + studentId).innerHTML = `<div class="log-saved">✓ Đã lưu đánh giá mốc (Buổi ${sessionNumber})</div>`;
    try { await rpc("teacher_link_photos", { p_batch_id: batchId, p_date: ngay }); } catch (e) {}
    toast("Đã lưu đánh giá mốc.");
    btn.disabled = false; btn.textContent = "Lưu đánh giá mốc";
  } catch (e) {
    toast("Không lưu được: " + e.message);
    btn.disabled = false; btn.textContent = "Lưu đánh giá mốc";
  }
}

async function loadAttendSummary(studentId, batchId){
  const box = document.getElementById("attend-" + studentId);
  if (!box) return;
  try {
    const cacheKey = batchId + "|" + (nextSessionEstimate[studentId] || "");
    if (!attendCache[cacheKey]) {
      const r = await rpc("teacher_batch_attendance_summary", { p_batch_id: batchId, p_session_number: nextSessionEstimate[studentId] || null });
      attendCache[cacheKey] = Array.isArray(r) ? r[0] : r;
    }
    const a = attendCache[cacheKey] || {};
    box.innerHTML = `
      <span class="tag t-green">${a.thuc_te ?? 0} buổi thực tế</span>
      <span class="tag t-amber">${a.nghi_co_phep ?? 0} nghỉ có phép</span>
      <span class="tag t-grey">${a.nghi_khong_phep ?? 0} nghỉ không phép</span>`;
  } catch (e) { box.innerHTML = `<span class="tag t-red">Không tải được</span>`; }
}

render();
</script>
</body>
</html>
